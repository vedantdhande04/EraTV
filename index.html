<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="EraTV — Time-travel through decades of Bollywood music on a vintage CRT television." />
  <title>EraTV — Time Travel TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Righteous&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    /* ============================================================
       1. CUSTOM PROPERTIES
       ============================================================ */
    :root {
      /* Scene */
      --bg-warm:    #d98020;
      --bg-light:   #e89830;
      --bg-dark:    #a85808;

      /* Plastic palette (TV / remote) */
      --yellow-hi:  #edc850;
      --yellow-mid: #dbb228;
      --yellow-lo:  #c09418;
      --yellow-dk:  #9a7812;

      /* Text on warm bg */
      --ink-dark:   #3d2810;
      --ink-warm:   rgba(80, 50, 15, 0.55);

      /* Player bar */
      --bar-bg:     #1e1508;
      --bar-border: rgba(196, 151, 58, 0.55);
      --bar-text:   #f5e6c8;
      --bar-muted:  rgba(245, 230, 200, 0.6);
      --bar-accent: #e8c36a;

      /* Measured transparent hole in bg_main.png (2752×1536) */
      --scr-top:    30.46875%;
      --scr-left:   37.20930%;
      --scr-width:  25.18169%;
      --scr-height: 38.28125%;
    }

    /* ============================================================
       2. RESET
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: Figtree, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg-warm);
      color: #fff;
    }

    /* ============================================================
       3. HIDDEN YOUTUBE PLAYER
       ============================================================ */
    .yt-offscreen {
      pointer-events: none;
      position: fixed;
      left: -9999px;
      top: 0;
      width: 320px;
      height: 180px;
      overflow: hidden;
      opacity: 0;
    }
    .yt-offscreen iframe {
      width: 320px;
      height: 180px;
      border: 0;
    }

    /* ============================================================
       4. SCENE LAYOUT
       ============================================================ */
    .scene {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      /* Fallback color matching the TV image bg, only visible during load */
      background: #c9a056;
    }

    .scene-content {
      position: absolute;
      inset: 0;
    }

    /* ============================================================
       5. BRAND TAG
       ============================================================ */
    .brand-tag {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.22em;
      line-height: 1.2;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
      user-select: none;
      pointer-events: none;
    }

    .online-pill {
      position: fixed;
      top: 32px;
      left: 44px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #fff;
      background: rgba(22, 16, 12, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 10px 36px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      user-select: none;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #1ed760;
      box-shadow: 0 0 8px rgba(30, 215, 96, 0.7);
      animation: pulse-dot 2.2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.86); }
    }

    .spotify-pill {
      position: fixed;
      top: 32px;
      right: 44px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 36px);
      padding: 8px 12px 8px 10px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background: rgba(22, 16, 12, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 10px 36px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    }
    .spotify-pill:hover {
      background: rgba(22, 16, 12, 0.5);
      border-color: rgba(30, 215, 96, 0.55);
      transform: scale(1.02);
    }
    .spotify-pill-logo {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #1ed760;
    }
    .spotify-pill-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .spotify-pill-arrow {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .share-feed {
      position: absolute;
      z-index: 18;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }
    .share-feed-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      pointer-events: auto;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 86%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 86%, transparent 100%);
    }
    .share-feed-track {
      display: flex;
      flex-direction: column;
    }
    .share-feed.is-looping .share-feed-track {
      animation: share-float 36s linear infinite;
    }
    .share-feed-scroll:hover .share-feed-track {
      animation-play-state: paused;
    }
    @keyframes share-float {
      from { transform: translateY(0); }
      to { transform: translateY(-50%); }
    }
    .share-feed-inner {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 22px 4px;
    }
    .share-line {
      max-width: 86%;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }
    .share-line.shift-0 { margin-left: 0; }
    .share-line.shift-1 { margin-left: 16%; }
    .share-line.shift-2 { margin-left: 6%; }
    .share-line.shift-3 { margin-left: 22%; }
    .share-line-name { font-weight: 700; color: rgba(255, 255, 255, 0.86); }
    .share-line-link {
      color: rgba(255, 255, 255, 0.86);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-word;
    }
    .share-line-link:hover { color: #1ed760; }
    .share-line-arrow {
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-left: 3px;
      vertical-align: -1px;
    }
    .share-line-note {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      font-style: italic;
      color: rgba(255, 255, 255, 0.58);
    }
    .share-line-credit {
      color: rgba(255, 255, 255, 0.62);
      font-style: italic;
    }
    .share-line-credit-link {
      color: rgba(255, 255, 255, 0.82);
      font-weight: 700;
      font-style: normal;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .share-line-credit-link:hover { color: #1ed760; }

    .share-open-btn {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 40;
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      color: #04120a;
      background: #1ed760;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .share-open-btn:hover { filter: brightness(1.06); }

    .share-form-card {
      position: fixed;
      left: 22px;
      bottom: 64px;
      z-index: 41;
      width: 260px;
      padding: 12px 14px;
      border-radius: 18px;
      color: #fff;
      background: rgba(22, 16, 12, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 10px 36px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      display: none;
    }
    .share-form-card.is-open { display: block; }
    .share-form-card .share-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .share-form-title {
      margin: 0 0 2px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .share-form-input {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.28);
      outline: none;
    }
    .share-form-input::placeholder { color: rgba(255, 255, 255, 0.45); }
    .share-form-input:focus { border-color: rgba(30, 215, 96, 0.7); }
    .share-form-submit {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      color: #04120a;
      background: #1ed760;
      cursor: pointer;
    }
    .share-form-status {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.78);
    }
    .share-form-status.is-ok { color: #1ed760; }
    .share-form-status.is-err { color: #ffb4b4; }
    .share-form-cooldown {
      display: none;
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.88);
    }
    .share-form-card.is-cooling .share-form-cooldown { display: block; }
    .share-form-card.is-cooling .share-form-input,
    .share-form-card.is-cooling .share-form-submit { display: none; }
    .share-form-input:disabled,
    .share-form-submit:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ============================================================
       6. FILE WARNING
       ============================================================ */
    .file-warning {
      display: none;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: calc(100% - 32px);
      padding: 8px 14px;
      background: rgba(42, 34, 8, 0.85);
      border: 1px solid rgba(232, 195, 106, 0.5);
      color: #f0c674;
      border-radius: 12px;
      font-size: 0.75rem;
      text-align: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    /* ============================================================
       7. TV IMAGE — full viewport cover
       ============================================================ */
    .tv-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 2;          /* ON TOP — content shows through transparent screen */
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none; /* clicks pass through to screen & remote below */
    }

    /* ============================================================
       8. TV SCREEN — sits BEHIND the TV image
       ============================================================ */
    .tv-screen {
      position: absolute;
      /* JS sets top/left/width/height dynamically via positionScreen() */
      overflow: hidden;
      z-index: 1;          /* BEHIND the TV image */
      background: #000;
      -webkit-mask-image: url("screen-hole-mask.png");
      mask-image: url("screen-hole-mask.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    .screen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 3;
      display: none;
      background: #000;
    }
    .screen-video.is-on {
      display: block;
      filter: contrast(1.12) saturate(1.08) brightness(0.93);
    }
    .tv-screen.has-video .screen-content { opacity: 0; }

    .yt-stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      background: #000;
    }
    .yt-stage > div,
    .yt-stage iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220%;
      height: 145%;
      min-width: 100%;
      min-height: 100%;
      border: 0;
      transform: translate(-50%, -47%);
    }
    .tv-screen.has-yt .screen-content { opacity: 0; }
    .tv-screen.has-yt .screen-noise,
    .tv-screen.has-yt .screen-noise.active { opacity: 0.2; }

    /* Screen glow (bleeds beyond bezel) */
    .tv-glow {
      position: absolute;
      /* JS positions this too */
      border-radius: 12px;
      z-index: 0;          /* behind everything */
      pointer-events: none;
      filter: blur(22px);
      opacity: 0.25;
      transition: background 0.6s ease;
    }

    /* ---- screen layers (stacked bottom-to-top) ---- */

    .screen-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      transition: background 0.5s ease;
    }

    .screen-content {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8%;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .screen-content.transitioning { opacity: 0; }

    .tv-screen.is-now .screen-content { opacity: 1; }
    .tv-screen.is-now .era-badge { display: none; }
    .tv-screen.is-now .era-tagline {
      display: inline-block;
      max-width: 14em;
      padding: 8px 12px;
      border-radius: 8px;
      color: #fff;
      opacity: 1;
      font-size: clamp(0.62rem, 1.25vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.62);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }
    .tv-screen.is-now .screen-noise,
    .tv-screen.is-now .screen-noise.active { opacity: 0.7; }

    .era-badge {
      font-family: 'Righteous', cursive;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 1;
      transition: color 0.4s, text-shadow 0.4s;
    }

    .era-tagline {
      font-size: clamp(0.55rem, 1.2vw, 0.85rem);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Noise canvas */
    .screen-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.15s ease;
    }
    .screen-noise.active { opacity: 0.75; }

    /* CRT glass — between video and the TV PNG, clipped to the hole */
    .screen-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    .screen-fx-scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.4;
    }

    .screen-fx-rgb {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 40, 40, 0.035) 0px,
        rgba(40, 255, 80, 0.03) 1px,
        rgba(40, 80, 255, 0.035) 2px,
        transparent 3px
      );
      mix-blend-mode: overlay;
    }

    .screen-fx-grain {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    .screen-fx-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 78% 72% at 50% 48%,
        transparent 38%,
        rgba(0, 0, 0, 0.22) 70%,
        rgba(0, 0, 0, 0.58) 100%
      );
      box-shadow:
        inset 0 0 48px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .screen-fx-glass {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          118deg,
          rgba(255, 248, 230, 0.2) 0%,
          rgba(255, 255, 255, 0.07) 18%,
          transparent 36%
        ),
        radial-gradient(
          ellipse 80% 50% at 18% 14%,
          rgba(255, 244, 214, 0.22),
          transparent 58%
        ),
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.06),
          transparent 18%,
          transparent 82%,
          rgba(0, 0, 0, 0.18)
        );
    }

    /* CRT flicker */
    @keyframes crt-flicker {
      0%, 100% { opacity: 1; }
      42% { opacity: 0.985; }
      44% { opacity: 0.96; }
      46% { opacity: 0.995; }
    }
    .tv-screen { animation: crt-flicker 4s infinite; }

    /* ============================================================
       9. PER-ERA SCREEN STYLES
       ============================================================ */

    /* 60s — Golden sepia */
    .era-60s .screen-bg {
      background: linear-gradient(170deg, #b89968 0%, #8b7355 40%, #a08868 80%, #6b5840 100%);
    }
    .era-60s .era-badge {
      color: #2d1b0e;
      text-shadow: 0 1px 3px rgba(255,255,255,0.25);
    }
    .era-60s .era-tagline { color: #3d2b15; }
    .era-60s ~ .tv-glow { background: #b89968; }

    /* 70s — Warm disco */
    .era-70s .screen-bg {
      background: linear-gradient(170deg, #e8890f 0%, #cd6f20 40%, #8b4513 100%);
    }
    .era-70s .era-badge {
      color: #fff8e0;
      text-shadow: 0 2px 8px rgba(139,69,19,0.6), 0 0 30px rgba(255,180,0,0.25);
    }
    .era-70s .era-tagline { color: rgba(255,248,224,0.85); }
    .era-70s ~ .tv-glow { background: #e87010; }

    /* 80s — Neon synthwave */
    .era-80s .screen-bg {
      background: linear-gradient(170deg, #0a001a 0%, #1a0040 30%, #2d0060 55%, #e0005e 100%);
    }
    .era-80s .era-badge {
      color: #ff2d78;
      text-shadow:
        0 0 7px #ff2d78,
        0 0 15px #ff2d78,
        0 0 30px #ff2d78,
        0 0 60px rgba(255,45,120,0.5);
    }
    .era-80s .era-tagline { color: #80d0ff; }
    .era-80s ~ .tv-glow { background: #ff2d78; }

    /* 90s — Grunge VHS */
    .era-90s .screen-bg {
      background: linear-gradient(170deg, #1e2530 0%, #2d3748 40%, #3a4a60 70%, #1e2530 100%);
    }
    .era-90s .era-badge {
      color: #e8e8e8;
      text-shadow: 3px 3px 0 #c0392b, -2px -2px 0 #2980b9;
    }
    .era-90s .era-tagline { color: rgba(220,220,220,0.8); }
    .era-90s ~ .tv-glow { background: #4a5568; }

    /* 2000s — Glossy digital */
    .era-2000s .screen-bg {
      background: linear-gradient(170deg, #065f56 0%, #0d9488 35%, #14b8a6 60%, #0a7c70 100%);
    }
    .era-2000s .era-badge {
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      background: linear-gradient(180deg, #fff 20%, #b0e0d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .era-2000s .era-tagline { color: rgba(255,255,255,0.85); }
    .era-2000s ~ .tv-glow { background: #0d9488; }

    /* 2010s — Minimal LED */
    .era-2010s .screen-bg {
      background: linear-gradient(170deg, #0c1220 0%, #111d35 40%, #0c1220 100%);
    }
    .era-2010s .era-badge {
      color: #818cf8;
      text-shadow: 0 0 12px rgba(129,140,248,0.5), 0 0 30px rgba(129,140,248,0.2);
    }
    .era-2010s .era-tagline { color: rgba(160,170,255,0.7); }
    .era-2010s ~ .tv-glow { background: #4f5bc4; }

    /* Now — Crisp modern */
    .era-now .screen-bg {
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf0 50%, #f0f2f5 100%);
    }
    .era-now .era-badge {
      color: #0f172a;
      text-shadow: none;
    }
    .era-now .era-tagline { color: #475569; }

    const DESKTOP_BG = "bg_main.png";

    const DESKTOP_FRAC = { top: 0.3046875, left: 0.37209302325581395, width: 0.25181686046511625, height: 0.3828125 };
    const PHONE_FRAC_FALLBACK = { top: 0.39, left: 0.13, width: 0.74, height: 0.26 };
    let phoneFrac = null;
    let phoneMaskUrl = null;
    let measuringHole = false;

    function isPhoneLayout() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function currentScreenFrac() {
      if (!isPhoneLayout()) return DESKTOP_FRAC;

    function applyScreenMask() {
      if (isPhoneLayout() && phoneMaskUrl) {
        tvScreen.style.webkitMaskImage = 'url("' + phoneMaskUrl + '")';
        tvScreen.style.maskImage = 'url("' + phoneMaskUrl + '")';
      } else {
        tvScreen.style.webkitMaskImage = "";

      }

    function measureTransparentHole(img) {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.naturalWidth);
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h).data;

      function scan(test) {
        let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (!test(data[i], data[i + 1], data[i + 2], data[i + 3], x, y)) continue;
            found = true;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
        return found ? { minX, minY, maxX, maxY } : null;
      }

      let box = scan(function (_r, _g, _b, a) { return a < 28; });
      if (!box) {
        box = scan(function (r, g, b, a, x, y) {
          return a > 180 && r + g + b < 20 && y > h * 0.22 && y < h * 0.78 && x > w * 0.06 && x < w * 0.94;
        });
      }
      if (!box) return { frac: PHONE_FRAC_FALLBACK, maskUrl: null };

      const pad = 1;
      const minX = Math.max(0, box.minX - pad);
      const minY = Math.max(0, box.minY - pad);
      const maxX = Math.min(w - 1, box.maxX + pad);
      const maxY = Math.min(h - 1, box.maxY + pad);
      const frac = {
        top: minY / h,
        left: minX / w,
        width: (maxX - minX + 1) / w,
        height: (maxY - minY + 1) / h
      };

      const mw = maxX - minX + 1;
      const mh = maxY - minY + 1;
      const mask = document.createElement("canvas");
      mask.width = mw;
      mask.height = mh;
      const mctx = mask.getContext("2d");
      const mid = mctx.createImageData(mw, mh);
      for (let y = 0; y < mh; y++) {
        for (let x = 0; x < mw; x++) {
          const i = ((minY + y) * w + (minX + x)) * 4;
          const a = data[i + 3];
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const hole = a < 28 || (r + g + b < 20 && a > 180);
          const o = (y * mw + x) * 4;
          const v = hole ? 255 : 0;
          mid.data[o] = mid.data[o + 1] = mid.data[o + 2] = mid.data[o + 3] = v;
        }
      }
      mctx.putImageData(mid, 0, 0);
      return { frac: frac, maskUrl: mask.toDataURL("image/png") };
    }

    function positionScreen() {
      if (!tvImg.naturalWidth) return;

      const cW = tvImg.clientWidth;
      const cH = tvImg.clientHeight;
      const iW = tvImg.naturalWidth;
      const iH = tvImg.naturalHeight;
      const cRatio = cW / cH;
      const iRatio = iW / iH;

      const posY = isPhoneLayout() ? 0.78 : 0.5;
      let rW, rH, oX, oY;
      if (cRatio > iRatio) {
        rW = cW;
        rH = cW / iRatio;
        oX = 0;
        oY = (cH - rH) * posY;
      } else {
        rH = cH;
        rW = cH * iRatio;
        oX = (cW - rW) / 2;
        oY = 0;
      }

      const frac = currentScreenFrac();
      const sLeft   = oX + rW * frac.left;
      const sTop    = oY + rH * frac.top;
      const sWidth  = rW * frac.width;
      const sHeight = rH * frac.height;

      tvScreen.style.left   = sLeft   + "px";
      tvScreen.style.top    = sTop    + "px";
      tvScreen.style.width  = sWidth  + "px";
      tvScreen.style.height = sHeight + "px";

      tvGlow.style.left   = (sLeft - 10)   + "px";
      tvGlow.style.top    = (sTop - 10)    + "px";
      tvGlow.style.width  = (sWidth + 20)  + "px";
      tvGlow.style.height = (sHeight + 20) + "px";
    }

    function syncBackground() {
      const phone = isPhoneLayout();
      document.body.classList.toggle("is-phone", phone);
      const next = phone ? PHONE_BG : DESKTOP_BG;
      const current = tvImg.getAttribute("src") || "";
      if (current !== next) {
        tvImg.src = next;
        return;
      }
      if (phone && tvImg.naturalWidth && !phoneFrac && !measuringHole) {
        measuringHole = true;
        const metrics = measureTransparentHole(tvImg);
        phoneFrac = metrics.frac;
        phoneMaskUrl = metrics.maskUrl;
        measuringHole = false;
      }
      applyScreenMask();
      positionScreen();
    }

    function positionShareFeed() {
      if (!shareFeed || !tvScreen.offsetWidth) return;
      const scene = document.getElementById("scene");
      const sceneRect = scene.getBoundingClientRect();
      const tv = tvScreen.getBoundingClientRect();
      const tvLeft = tv.left - sceneRect.left;
      const tvTop = tv.top - sceneRect.top;
      const tvH = tv.height;

      if (isPhoneLayout()) {
        const top = 46;
        const gap = 26;
        shareFeed.style.left = "12px";
        shareFeed.style.right = "12px";
        shareFeed.style.width = "auto";
        shareFeed.style.top = top + "px";
        shareFeed.style.height = Math.max(52, tvTop - top - gap) + "px";

      const left = 28;
      const gap = 28;
      shareFeed.style.left = left + "px";
      shareFeed.style.right = "auto";
      shareFeed.style.width = Math.max(160, Math.min(340, tvLeft - left - gap)) + "px";
      shareFeed.style.top = tvTop + "px";
      shareFeed.style.height = tvH + "px";
    }

    /* ==========================================================
       UTILITIES
       ========================================================== */
    function seedId(era) {
      if (sessionSeeds[era]) return sessionSeeds[era];
      const entry = eraPlaylists[era] || {};
      return entry.seed || (entry.ids && entry.ids[0]) || entry.id;
    }

    function markTriedSeed(era, id) {
      if (!triedSeeds[era]) triedSeeds[era] = {};
      if (id) triedSeeds[era][id] = true;
    }

    function rerollSessionSeed(era) {
      const current = sessionSeeds[era] || seedId(era);
      markTriedSeed(era, current);
      const ids = ((eraPlaylists[era] && eraPlaylists[era].ids) || []).filter(function (id) {
        return id && !triedSeeds[era][id];
      });
      if (!ids.length) return "";
      sessionSeeds[era] = ids[Math.floor(Math.random() * ids.length)];
      return sessionSeeds[era];
    }

    function mixId(era) {
      const seed = seedId(era);
      return seed ? "RD" + seed : "";
    }

    function curatedPlaylistId(era) {
      return eraYtPlaylists[era] || "";
    }

    function loadEraAudio(p, era) {
      if (!p) return;
      p.loadVideoById(seedId(era));
    }

    function createPlaylistPlayer(era) {
      const list = curatedPlaylistId(era);
      if (!list || playlistPlayers[era]) return;
      const host = document.createElement("div");
      host.id = "yt-pl-" + era;
      ytDock.appendChild(host);
      const vars = playerVars();
      vars.list = list;
      vars.listType = "playlist";
      vars.index = 0;
      playlistPlayers[era] = new YT.Player(host.id, {
        width: 320,
        height: 180,
        playerVars: vars,
        events: {
          onReady: function () {
            const p = playlistPlayers[era];
            playlistReady[era] = true;
            lockReferrer();
            preferSmall(p);
            try {
              p.mute();
              p.setVolume(0);
              if (p.setShuffle) p.setShuffle(true);
              if (p.setLoop) p.setLoop(true);
            } catch (err) { /* ignore */ }
          },
          onStateChange: function (event) {
            if (!usingPlaylist[era]) {
              if (event.data === YT.PlayerState.PLAYING) {
                try {
                  playlistPlayers[era].pauseVideo();
                  playlistPlayers[era].mute();
                } catch (err) { /* ignore */ }
              }
              return;
            }
            onEraStateChange(era, event);
          },
          onError: function () {
            playlistReady[era] = false;
          }
        }
      });
    }

    function switchToPlaylist(era) {
      if (!curatedPlaylistId(era)) return false;
      const ready = playlistPlayers[era] && playlistReady[era];
      ignoreEnded = true;
      if (!ready) {
        const p = players[era];
        if (!p) return false;
        usingPlaylist[era] = true;
        inMixMode = true;
        player = p;
        try {
          p.loadPlaylist({ list: curatedPlaylistId(era), listType: "playlist", index: 0 });
          if (p.setShuffle) p.setShuffle(true);
          if (p.setLoop) p.setLoop(true);
          p.unMute();
          p.setVolume(80);
        } catch (err) { /* ignore */ }
        mountYtOnScreen(era);
        kickPlay(++mediaGen);
        setTimeout(function () { ignoreEnded = false; }, 800);
        return true;
      }
      if (players[era] && players[era] !== playlistPlayers[era]) {
        try { players[era].pauseVideo(); players[era].mute(); } catch (err) { /* ignore */ }
      }
      usingPlaylist[era] = true;
      inMixMode = true;
      player = playlistPlayers[era];
      try {
        player.unMute();
        player.setVolume(80);
        if (player.setShuffle) player.setShuffle(true);
        if (player.setLoop) player.setLoop(true);
        player.playVideo();
      } catch (err) { /* ignore */ }
      mountYtOnScreen(era);
      kickPlay(++mediaGen);
      setTimeout(function () { ignoreEnded = false; }, 800);
      return true;
    }

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }

    function eraQueue(era) {
      const entry = eraPlaylists[era] || {};
      const seed = seedId(era);
      const rest = (entry.ids || []).filter(function (id) { return id && id !== seed; });
      return seed ? [seed].concat(shuffle(rest)) : shuffle(rest);
    }

    function eraObj(id) {
      return ERAS.find(e => e.id === id) || ERAS[0];
    }

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, n));
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    /* ==========================================================
       REMOTE CONTROL — BUILD & HANDLERS
       ========================================================== */
    function buildRemote() {
      ERAS.forEach(era => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "era-chip";
        btn.dataset.era = era.id;
        btn.textContent = era.label;
        btn.setAttribute("aria-label", "Travel to " + era.label);
        btn.addEventListener("click", () => changeEra(era.id));
        remoteBtns.appendChild(btn);
      });
      updateRemoteActive(currentEra);
    }

    function updateRemoteActive(eraId) {
      remoteBtns.querySelectorAll(".era-chip").forEach(btn => {
        btn.classList.toggle("is-active", btn.dataset.era === eraId);
      });
      updateSpotifyPill(eraId);
    }

    function updateSpotifyPill(eraId) {
      const era = eraObj(eraId);
      const href = eraSpotify[eraId];
      if (!href) return;
      const name = eraId === "now" ? "2026" : era.label;
      spotifyPill.href = href;
      spotifyPillText.textContent = name + " playlist on Spotify";
      spotifyPill.setAttribute("aria-label", "Open " + name + " playlist on Spotify");
    }

    function eraVideoIds(era) {
      const entry = eraPlaylists[era] || {};
      const ids = (entry.ids || []).slice();
      const seed = seedId(era);
      if (seed && ids.indexOf(seed) === -1) ids.unshift(seed);
      return ids;
    }

    /* ==========================================================
       TV SCREEN — NOISE & ERA STYLING
       ========================================================== */
    function drawNoise() {
      const w = screenNoise.width;
      const h = screenNoise.height;
      const imageData = noiseCtx.createImageData(w, h);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() > 0.5 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 140;
      }
      noiseCtx.putImageData(imageData, 0, 0);
    }

    function applyEraScreen(eraId) {
      const era = eraObj(eraId);
      ERAS.forEach(e => tvScreen.classList.remove(e.screenClass));
      tvScreen.classList.add(era.screenClass);
      eraBadge.textContent = era.label;
      eraTagline.textContent = era.tagline;
    }

    function stopEraVideo() {
      if (videoReadyHandler) {
        eraVideo.removeEventListener("canplay", videoReadyHandler);
        eraVideo.removeEventListener("error", videoReadyHandler);
        videoReadyHandler = null;
      }
      eraVideo.pause();
      eraVideo.removeAttribute("src");
      eraVideo.removeAttribute("preload");
      eraVideo.load();
      eraVideo.classList.remove("is-on");
      tvScreen.classList.remove("has-video");
    }

    function abortEraVideo() {
      if (videoStartTimer) {
        clearTimeout(videoStartTimer);
        videoStartTimer = null;
      }
      stopEraVideo();
    }

    function scheduleEraVideo(eraId) {
      const src = eraVideos[eraId];
      const gen = screenGen;
      if (!src) {
        stopNoise(gen);
        return;
      }
      if (eraVideo.getAttribute("src") === src && eraVideo.classList.contains("is-on")) return;
      if (videoStartTimer) clearTimeout(videoStartTimer);
      videoStartTimer = setTimeout(function () {
        videoStartTimer = null;
        if (eraId !== currentEra || gen !== screenGen) return;
        setEraVideo(eraId, gen);
      }, 1400);
    }

    function startNoise(gen) {
      switchingEra = true;
      screenNoise.classList.add("active");
      screenContent.classList.add("transitioning");
      cancelAnimationFrame(noiseRaf);
      function loop() {
        if (gen !== screenGen) return;
        drawNoise();
        noiseRaf = requestAnimationFrame(loop);
      }
      noiseRaf = requestAnimationFrame(loop);
    }

    function stopNoise(gen) {
      if (gen !== screenGen) return;
      cancelAnimationFrame(noiseRaf);
      screenNoise.classList.remove("active");
      screenContent.classList.remove("transitioning");
      switchingEra = false;
    }

    function setEraVideo(eraId, gen) {
      const src = eraVideos[eraId];
      const started = Date.now();

      stopEraVideo();

      function reveal() {
        if (gen !== screenGen) return;
        const wait = Math.max(0, 280 - (Date.now() - started));
        setTimeout(function () {
          if (gen !== screenGen) return;
          if (src) {
            eraVideo.classList.add("is-on");
            tvScreen.classList.add("has-video");
            eraVideo.play().catch(function () { /* user gesture already happened */ });
          }
          stopNoise(gen);
        }, wait);
      }

      if (!src) {
        reveal();
        return;
      }

      videoReadyHandler = reveal;
      eraVideo.addEventListener("canplay", reveal, { once: true });
      eraVideo.addEventListener("error", reveal, { once: true });
      eraVideo.preload = "metadata";
      eraVideo.muted = true;
      eraVideo.src = src;
      eraVideo.load();
      setTimeout(function () {
        if (gen === screenGen && screenNoise.classList.contains("active")) reveal();
      }, 8000);
    }

    function playStaticTransition(eraId, callback) {
      const gen = ++screenGen;
      abortEraVideo();
      tvScreen.classList.remove("is-now");
      startNoise(gen);

      setTimeout(function () {
        if (gen !== screenGen) return;
        applyEraScreen(eraId);
        if (callback) callback();
      }, 180);
      return gen;
    }

    function holdNowScreen() {
      const gen = ++screenGen;
      abortEraVideo();
      tvScreen.classList.add("is-now");
      applyEraScreen("now");
      screenContent.classList.remove("transitioning");
      startNoise(gen);
      return gen;
    }

    /* ==========================================================
       ERA CHANGE — MAIN ENTRY POINT
       ========================================================== */
    function changeEra(eraId) {
      if (!eraPlaylists[eraId]) return;
      unlockAudio();
      if (eraId === currentEra) {
        if (!playing && players[eraId]) activateEraAudio(eraId);
        return;
      }
      const visualChange = eraId !== currentEra;

      currentEra = eraId;
      loadedEra = null;
      inMixMode = !!mixMode[eraId];
      ignoreEnded = true;
      errorStreak = 0;
      updateRemoteActive(eraId);
      trackTitle.textContent = eraObj(eraId).label + " radio";
      trackArtist.textContent = seedArmed[eraId] ? "Live" : "Tuning in…";
      setArtwork(seedId(eraId));

      if (eraId === "now") holdNowScreen();
      else if (visualChange) playStaticTransition(eraId);

      activateEraAudio(eraId);
      trackListening();
    }

    /* ==========================================================
       YOUTUBE — ONE HIDDEN PLAYER PER ERA SEED
       ========================================================== */
    function lockReferrer() {
      const roots = [ytDock, ytStage];
      roots.forEach(function (root) {
        if (!root) return;
        root.querySelectorAll("iframe").forEach(function (iframe) {
          iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        });
      });
    }

    function playerVars() {
      const vars = {
        controls: 0,
        disablekb: 1,
        fs: 0,
        modestbranding: 1,
        rel: 0,
        playsinline: 1,
        autoplay: 0,
        cc_load_policy: 0,
        iv_load_policy: 3
      };
      if (location.protocol.startsWith("http")) vars.origin = location.origin;
      return vars;
    }

    function hideCaptions(p) {
      if (!p) return;
      try { p.unloadModule("captions"); } catch (err) { /* ignore */ }
      try { p.unloadModule("cc"); } catch (err) { /* ignore */ }
      try { p.setOption("captions", "track", {}); } catch (err) { /* ignore */ }
    }

    function preferSmall(p) {
      if (!p) return;
      try { if (p.setPlaybackQuality) p.setPlaybackQuality("small"); } catch (err) { /* ignore */ }
      try { if (p.setPlaybackQualityRange) p.setPlaybackQualityRange("small", "small"); } catch (err) { /* ignore */ }
    }

    function preferVisible(p) {
      if (!p) return;
      try { if (p.setPlaybackQuality) p.setPlaybackQuality("medium"); } catch (err) { /* ignore */ }
      try { if (p.setPlaybackQualityRange) p.setPlaybackQualityRange("small", "hd720"); } catch (err) { /* ignore */ }
    }

    function ytHostFor(era) {
      if (usingPlaylist[era]) return document.getElementById("yt-pl-" + era);
      return document.getElementById("yt-" + era);
    }

    let ignoreUiPauseUntil = 0;

    function mountYtOnScreen(era) {
      if (!ytStage) return;
      const active = ytHostFor(era);
      Array.from(ytStage.children).forEach(function (child) {
        if (child !== active) ytDock.appendChild(child);
      });
      if (active && active.parentNode !== ytStage) {
        ytStage.appendChild(active);
        ignoreUiPauseUntil = Date.now() + 1600;
      }
      tvScreen.classList.toggle("has-yt", !!active);
      const p = (usingPlaylist[era] && playlistPlayers[era]) || players[era];
      preferVisible(p);
      hideCaptions(p);
    }

    function nextPreloadEra() {
      for (let i = 0; i < AUDIO_LOAD_ORDER.length; i++) {
        const era = AUDIO_LOAD_ORDER[i];
        if (era === currentEra) continue;
        if (!players[era] || !seedArmed[era]) return era;
      }
      return null;
    }

    function continuePreload() {
      if (preloadTimer) {
        clearTimeout(preloadTimer);
        preloadTimer = null;
      }
      if (currentEra === "now" && !nowHasPlayed) return;
      const era = nextPreloadEra();
      if (!era) return;
      if (!players[era]) {
        console.log("[EraTV] preload create", era);
        createEraPlayer(era);
        return;
      }
      if (!seedArmed[era] && !mixMode[era]) armBackgroundSeed(era);
    }

    function schedulePreload(delay) {
      if (preloadTimer) clearTimeout(preloadTimer);
      preloadTimer = setTimeout(function () {
        preloadTimer = null;
        continuePreload();
      }, delay);
    }

    function pauseOtherPlayers(exceptEra) {
      ERA_IDS.forEach(function (era) {
        if (era === exceptEra) return;
        if (preloadParkTimers[era]) {
          clearTimeout(preloadParkTimers[era]);
          preloadParkTimers[era] = null;
        }
        [players[era], playlistPlayers[era]].forEach(function (p) {
          if (!p) return;
          try {
            const state = p.getPlayerState();
            if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
              p.pauseVideo();
              if (p === players[era] && !mixMode[era] && !usingPlaylist[era]) {
                p.seekTo(0, true);
                seedArmed[era] = true;
              }
            }
            p.mute();
          } catch (err) { /* ignore */ }
        });
      });
    }

    function parkPreloadedSeed(era) {
      const p = players[era];
      if (!p || era === currentEra || mixMode[era]) return;
      try {
        p.pauseVideo();
        p.seekTo(0, true);
        p.mute();
        seedArmed[era] = true;
        console.log("[EraTV] armed seed", era);
      } catch (err) { /* ignore */ }
      if (curatedPlaylistId(era)) createPlaylistPlayer(era);
      schedulePreload(200);
    }

    function armBackgroundSeed(era) {
      const p = players[era];
      if (!p || era === currentEra || mixMode[era] || seedArmed[era]) return;
      try {
        p.mute();
        p.setVolume(0);
        p.seekTo(0, true);
        p.playVideo();
      } catch (err) {
        try { loadEraAudio(p, era); } catch (e2) { /* ignore */ }
      }
    }

    function kickPlay(gen) {
      if (playKickTimer) clearTimeout(playKickTimer);
      let tries = 0;
      function tick() {
        if (gen !== mediaGen || !player) return;
        try {
          const state = player.getPlayerState();
          if (state === YT.PlayerState.PLAYING) return;
          player.unMute();
          player.setVolume(80);
          player.playVideo();
        } catch (err) { /* ignore */ }
        tries += 1;
        if (tries < 10) playKickTimer = setTimeout(tick, 350);
        else if (gen === mediaGen) {
          trackArtist.textContent = "Press play if audio is blocked";
        }
      }
      playKickTimer = setTimeout(tick, 60);
    }

    function activateEraAudio(era) {
      const next = players[era];
      if (!next) {
        pendingEra = era;
        trackArtist.textContent = "Tuning in…";
        createEraPlayer(era);
        return;
      }

      const gen = ++mediaGen;
      pendingEra = null;
      errorStreak = 0;
      ignoreEnded = true;
      loadedEra = era;
      inMixMode = !!mixMode[era];
      player = next;
      console.log("[EraTV] activate", era, { armed: !!seedArmed[era], mix: !!mixMode[era] });

      pauseOtherPlayers(era);

      try {
        preferSmall(next);
        next.unMute();
        next.setVolume(80);
        if (curatedPlaylistId(era) && usingPlaylist[era] && playlistPlayers[era]) {
          player = playlistPlayers[era];
          player.unMute();
          player.setVolume(80);
          player.playVideo();
        } else if (curatedPlaylistId(era)) {
          usingPlaylist[era] = false;
          if (seedArmed[era]) {
            next.seekTo(0, true);
            next.playVideo();
          } else {
            next.playVideo();
          }
          createPlaylistPlayer(era);
        } else if (mixMode[era]) {
          mixMode[era] = false;
          inMixMode = false;
          seedArmed[era] = false;
          next.loadVideoById(seedId(era));
        } else if (seedArmed[era]) {
          next.seekTo(0, true);
          next.playVideo();
        } else {
          next.playVideo();
        }
      } catch (err) {
        try { loadEraAudio(next, era); } catch (e2) { /* ignore */ }
      }

      mountYtOnScreen(era);
      kickPlay(gen);
      if (curatedPlaylistId(era)) watchPlayStart(era);
      setTimeout(function () {
        if (gen === mediaGen) ignoreEnded = false;
      }, 800);
    }

    function startEraMix(era) {
      const p = players[era];
      if (!p || era !== currentEra || mixMode[era] || curatedPlaylistId(era)) return;
      const mix = mixId(era);
      if (!mix) return;
      mixMode[era] = true;
      inMixMode = true;
      seedArmed[era] = false;
      console.log("[EraTV] era mix radio", era, mix);
      try {
        p.loadPlaylist({ list: mix, listType: "playlist", index: 0 });
        if (p.setShuffle) p.setShuffle(true);
        if (p.setLoop) p.setLoop(true);
        p.unMute();
        p.setVolume(80);
      } catch (err) {
        console.warn("[EraTV] mix failed", err);
        mixMode[era] = false;
        inMixMode = false;
        p.loadVideoById(seedId(era));
      }
    }

    function playlistAtEnd() {
      try {
        const list = player && player.getPlaylist && player.getPlaylist();
        if (!list || !list.length) return true;
        const idx = player.getPlaylistIndex();
        return idx >= list.length - 1;
      } catch (err) {
        return false;
      }
    }

    function createEraPlayer(era) {
      if (players[era]) return;
      const host = document.createElement("div");
      host.id = "yt-" + era;
      ytDock.appendChild(host);
      players[era] = new YT.Player(host.id, {
        width: 320,
        height: 180,
        videoId: seedId(era),
        playerVars: playerVars(),
        events: {
          onReady: function () { onEraPlayerReady(era); },
          onStateChange: function (event) { onEraStateChange(era, event); },
          onError: function (event) { onEraError(era, event); }
        }
      });
    }

    window.onYouTubeIframeAPIReady = function () {
      createEraPlayer("now");
    };

    function onEraPlayerReady(era) {
      playerReadyMap[era] = true;
      lockReferrer();
      preferSmall(players[era]);
      try { players[era].setVolume(era === currentEra ? 80 : 0); } catch (err) { /* ignore */ }

      if (era === "now") {
        playerReady = true;
        setControlsEnabled(true);
      }

      if (pendingEra === era || era === currentEra) {
        activateEraAudio(era);
      } else {
        armBackgroundSeed(era);
      }

      if (era === currentEra) syncMeta();
    }

    function onEraStateChange(era, event) {
      const state = event.data;
      const p = (usingPlaylist[era] && playlistPlayers[era]) || players[era];
      if (!p) return;

      if (era !== currentEra) {
        if (state === YT.PlayerState.PLAYING && !mixMode[era] && !seedArmed[era]) {
          preferSmall(p);
          if (preloadParkTimers[era]) clearTimeout(preloadParkTimers[era]);
          preloadParkTimers[era] = setTimeout(function () {
            preloadParkTimers[era] = null;
            parkPreloadedSeed(era);
          }, 900);
        }
        return;
      }

      if (player && event.target && event.target !== player) return;

      if (state === YT.PlayerState.PLAYING) setPlaying(true);
      else if (state === YT.PlayerState.PAUSED && Date.now() > ignoreUiPauseUntil) setPlaying(false);
      if (
        state === YT.PlayerState.PLAYING ||
        state === YT.PlayerState.PAUSED ||
        state === YT.PlayerState.BUFFERING ||
        state === YT.PlayerState.CUED
      ) {
        errorStreak = 0;
        if (state === YT.PlayerState.PLAYING) {
          if (playWatchTimer) {
            clearTimeout(playWatchTimer);
            playWatchTimer = null;
          }
          ignoreEnded = false;
          seedArmed[era] = true;
          preferVisible(p);
          hideCaptions(p);
          if (era === "now") nowHasPlayed = true;
          mountYtOnScreen(era);
          schedulePreload(era === "now" ? 1500 : 400);
          if (curatedPlaylistId(era) && !usingPlaylist[era]) createPlaylistPlayer(era);
        }
        syncMeta();
      }
      if (state === YT.PlayerState.ENDED) {
        if (ignoreEnded) return;
        if (curatedPlaylistId(era)) {
          if (!usingPlaylist[era]) {
            switchToPlaylist(era);
            return;
          }
          try {
            if (playlistAtEnd()) p.playVideoAt(0);
            else p.nextVideo();
          } catch (err) { /* ignore */ }
          return;
        }
        if (mixMode[era]) return;
        startEraMix(era);
      }
    }

    let playWatchTimer = null;
    function watchPlayStart(era) {
      if (playWatchTimer) clearTimeout(playWatchTimer);
      playWatchTimer = setTimeout(function () {
        playWatchTimer = null;
        if (era !== currentEra || !player) return;
        try {
          const st = player.getPlayerState();
          if (
            st === YT.PlayerState.PLAYING ||
            st === YT.PlayerState.BUFFERING ||
            st === YT.PlayerState.PAUSED
          ) return;
        } catch (err) { /* ignore */ }
        skipBlockedVideo(era);
      }, 2600);
    }

    function skipBlockedVideo(era) {
      if (curatedPlaylistId(era) && !usingPlaylist[era]) {
        const next = rerollSessionSeed(era);
        if (next && players[era]) {
          try { players[era].loadVideoById(next); } catch (err) { /* ignore */ }
          watchPlayStart(era);
          return;
        }
        switchToPlaylist(era);
        watchPlayStart(era);
        return;
      }
      if (curatedPlaylistId(era)) {
      if (mixMode[era] || inMixMode) {
        try { if (player) player.nextVideo(); } catch (err) { /* ignore */ }
        return;
      }
      startEraMix(era);
    }

    function onEraError(era, event) {
      if (era !== currentEra) {
        seedArmed[era] = false;
        return;
      }
      const code = event.data;
      errorStreak += 1;
      console.warn("[EraTV] player error", era, code);

      if (code === 100 || code === 101 || code === 150 || code === 2) {
        skipBlockedVideo(era);
        return;
      }

      if (code === 153) {
        lockReferrer();
        if (errorStreak < 2) {
          if (curatedPlaylistId(era) && !usingPlaylist[era]) players[era].loadVideoById(rerollSessionSeed(era));
          else loadEraAudio(players[era], era);
        } else {
          skipBlockedVideo(era);
        }
        return;
      }

      if (errorStreak < 3) {
        seedArmed[era] = false;
        if (curatedPlaylistId(era) && !usingPlaylist[era]) {
          players[era].loadVideoById(rerollSessionSeed(era));
        } else {
          skipBlockedVideo(era);
        }
      } else {
        skipBlockedVideo(era);
      }
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      if (player) {
        try {
          player.unMute();
          player.setVolume(80);
          if (!playing) player.playVideo();
        } catch (err) { /* ignore */ }
      }
      schedulePreload(400);
    }

    /* ==========================================================
       PLAYER CONTROLS & META
       ========================================================== */
    function setControlsEnabled(enabled) {
      playBtn.disabled = !enabled;
      prevBtn.disabled = !enabled;
      nextBtn.disabled = !enabled;
      seekBtn.disabled = !enabled;
    }

    function setPlaying(isPlaying) {
      playing = isPlaying;
      playIcon.innerHTML = isPlaying ? PAUSE_ICON : PLAY_ICON;
      playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
      playIcon.classList.toggle("play-icon", !isPlaying);
    }

    function parseMeta(data) {
      const raw = String((data && data.title) || "").trim();
      if (!raw) return null;
      const parts = raw.split(/\s[-|–]\s/);
      if (parts.length >= 2) {
        return {
          title: parts[0].trim(),
          artist: parts.slice(1).join(" · ").trim() || data.author || "Bollywood"
        };
      }
      return { title: raw, artist: (data && data.author) || "Bollywood" };
    }

    function setArtwork(videoId) {
      if (!videoId) { art.innerHTML = "<div></div>"; return; }
      art.innerHTML = '<img alt="" src="https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg" />';
    }

    function syncMeta() {
      if (!player || !player.getVideoData) return;
      try {
        const data = player.getVideoData() || {};
        const parsed = parseMeta(data);
        if (parsed) {
          trackTitle.textContent = parsed.title;
          trackArtist.textContent = parsed.artist;
        }
        if (data.video_id) setArtwork(data.video_id);
        duration = player.getDuration() || duration;
        const current = player.getCurrentTime() || 0;
        timeCurrent.textContent = formatTime(current);
        timeDuration.textContent = formatTime(duration);
        seekFill.style.width = duration ? ((current / duration) * 100).toFixed(2) + "%" : "0%";
        const state = player.getPlayerState && player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) setPlaying(true);
        else if (state === YT.PlayerState.PAUSED && Date.now() > ignoreUiPauseUntil) setPlaying(false);
      } catch (err) { /* ignore */ }
    }

    function isTypingTarget(el) {
      if (!el || el === document.body) return false;
      const tag = (el.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return true;
      if (el.isContentEditable) return true;
      return !!(el.closest && el.closest("input, textarea, select, [contenteditable='true']"));
    }

    function togglePlayback() {
      unlockAudio();
      if (!player) return;
      player.unMute();
      if (playing) player.pauseVideo();
      else player.playVideo();
    }

    playBtn.addEventListener("click", togglePlayback);

    document.addEventListener("keydown", function (event) {
      if (event.code !== "Space" && event.key !== " ") return;
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (isTypingTarget(event.target)) return;
      event.preventDefault();
      togglePlayback();
    });

    prevBtn.addEventListener("click", function () {
      if (player && player.previousVideo) player.previousVideo();
    });
    nextBtn.addEventListener("click", function () {
      if (!player) return;
      if (curatedPlaylistId(currentEra)) {
        if (!usingPlaylist[currentEra]) {
          switchToPlaylist(currentEra);
          return;
        }
        if (playlistAtEnd()) player.playVideoAt(0);
        else player.nextVideo();
        return;
      }
      if (!inMixMode && playlistAtEnd()) startEraMix(currentEra);
      else player.nextVideo();
    });

    seekBtn.addEventListener("click", (event) => {
      if (!player || !duration) return;
      const rect = event.currentTarget.getBoundingClientRect();
      const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
      player.seekTo(duration * ratio, true);
    });

    /* ==========================================================
       INITIALIZATION
       ========================================================== */
    buildRemote();
    holdNowScreen();
    setArtwork(seedId(DEFAULT_ERA));
    setInterval(syncMeta, 500);
    document.addEventListener("pointerdown", unlockAudio, { once: true });

    const supabaseCfg = window.ERA_TV_SUPABASE || {};
    const supabaseClient = (window.supabase && supabaseCfg.url && supabaseCfg.anonKey)
      ? window.supabase.createClient(supabaseCfg.url, supabaseCfg.anonKey)
      : null;

    let presenceChannel = null;

    function setListeningCount(n) {
      const count = Math.max(1, Number(n) || 1);
      onlineCount.textContent = count + " listening";
    }

    function trackListening() {
      if (!presenceChannel) return;
      presenceChannel.track({ era: currentEra, at: Date.now() }).catch(function () { /* ignore */ });
    }

    function startListeningPresence() {
      if (!supabaseClient) {
        setListeningCount(1);
        return;
      }
      presenceChannel = supabaseClient.channel("erats-listening", {
        config: { presence: { key: (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) } }
      });
      presenceChannel.on("presence", { event: "sync" }, function () {
        const state = presenceChannel.presenceState();
        setListeningCount(Object.keys(state).length);
      });
      presenceChannel.subscribe(function (status) {
        if (status === "SUBSCRIBED") trackListening();
      });
    }

    startListeningPresence();

    const seenShareIds = new Set();
    const shareRows = [];
    const SHARE_NOTE_MAX = 48;
    const SHARE_ARROW = '<svg class="share-line-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';

    function setShareStatus(message, kind) {
      shareStatus.textContent = message || "";
      shareStatus.classList.toggle("is-ok", kind === "ok");
      shareStatus.classList.toggle("is-err", kind === "err");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizePlaylistUrl(raw) {
      const value = String(raw || "").trim();
      const match = value.match(/open\.spotify\.com\/playlist\/([A-Za-z0-9]+)/i)
        || value.match(/^spotify:playlist:([A-Za-z0-9]+)$/i);
      if (!match) return "";
      return "https://open.spotify.com/playlist/" + match[1];
    }

    function makeShareLine(row, index) {
      const line = document.createElement("div");
      line.className = "share-line shift-" + (index % 4);
      const note = String(row.message || "").trim();
      line.innerHTML =
        '<span class="share-line-name">' + escapeHtml(row.name || "Someone") + "</span>" +
        " shared a spotify playlist " +
        '<a class="share-line-link" href="' + escapeHtml(row.playlist_url) + '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(row.playlist_name || "playlist") +
        SHARE_ARROW +
        "</a>" +
        (note ? '<span class="share-line-note">“' + escapeHtml(note) + '”</span>' : "");
      return line;
    }

    function makeCreditLine(index) {
      const line = document.createElement("div");
      line.className = "share-line share-line-credit shift-" + (index % 4);
      line.innerHTML =
        'made with love by <a class="share-line-credit-link" href="https://www.instagram.com/codvyn/" target="_blank" rel="noopener noreferrer">codvyn</a>';
      return line;
    }

    function appendFeedItems(target) {
      shareRows.forEach(function (row, index) {
        target.appendChild(makeShareLine(row, index));
        if ((index + 1) % 5 === 0) target.appendChild(makeCreditLine(index + 1));
      });
    }

    function renderShareFeed() {
      shareFeedInner.innerHTML = "";
      shareFeedClone.innerHTML = "";
      appendFeedItems(shareFeedInner);
      appendFeedItems(shareFeedClone);
      const count = shareRows.length + Math.floor(shareRows.length / 5);
      shareFeed.classList.toggle("is-looping", shareRows.length > 0);
      shareFeedTrack.style.animationDuration = Math.max(22, count * 8) + "s";
    }

    function appendShareLine(row) {
      if (!row || !row.playlist_url) return;
      const id = row.id || (row.name + "|" + row.playlist_url + "|" + (row.created_at || ""));
      if (seenShareIds.has(id)) return;
      seenShareIds.add(id);
      shareRows.push(row);
      renderShareFeed();
    }

    async function fetchPlaylistName(url) {
      try {
        const res = await fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(url));
        if (!res.ok) return "";
        const data = await res.json();
        return String(data.title || "").trim();
      } catch (err) {
        return "";
      }
    }

    const SHARE_COOLDOWN_MS = 12 * 60 * 60 * 1000;
    let shareCooldownUntil = 0;
    let shareCooldownTimer = null;

    function shareCooldownLeft() {
      return Math.max(0, shareCooldownUntil - Date.now());
    }

    async function fetchShareCooldown() {
      if (!supabaseClient) {
        shareCooldownUntil = 0;
        return 0;
      }
      const { data, error } = await supabaseClient.rpc("share_cooldown_remaining");
      if (error) {
        console.warn("[EraTV] cooldown check failed", error);
        return shareCooldownLeft();
      }
      const secs = Math.max(0, Number(data) || 0);
      shareCooldownUntil = secs > 0 ? Date.now() + secs * 1000 : 0;
      return secs;
    }

    function formatShareCooldown(ms) {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const hours = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours > 0) return hours + "h " + mins + "m";
      if (mins > 0) return mins + "m " + secs + "s";
      return secs + "s";
    }

    function stopShareCooldownTick() {
      if (!shareCooldownTimer) return;
      clearInterval(shareCooldownTimer);
      shareCooldownTimer = null;
    }

    function setShareFormCooling(cooling) {
      shareFormCard.classList.toggle("is-cooling", cooling);
      shareName.disabled = cooling;
      shareInput.disabled = cooling;
      shareMessage.disabled = cooling;
      shareSubmit.disabled = cooling;
      if (!cooling) shareCooldown.textContent = "";
    }

    function updateShareCooldownUI() {
      const left = shareCooldownLeft();
      if (left <= 0) {
        stopShareCooldownTick();
        setShareFormCooling(false);
        return false;
      }
      setShareFormCooling(true);
      shareCooldown.textContent = "You can share again in " + formatShareCooldown(left);
      return true;
    }

    function closeShareForm() {
      if (!shareFormCard.classList.contains("is-open")) return;
      shareFormCard.classList.remove("is-open");
      setShareStatus("");
      stopShareCooldownTick();
    }

    async function openShareForm() {
      shareFormCard.classList.add("is-open");
      setShareStatus("");
      positionShareChrome();
      await fetchShareCooldown();
      if (updateShareCooldownUI()) {
        stopShareCooldownTick();
        shareCooldownTimer = setInterval(updateShareCooldownUI, 1000);
        return;
      }
      setTimeout(function () { shareName.focus(); }, 50);
    }

    shareOpenBtn.addEventListener("click", function () {
      if (shareFormCard.classList.contains("is-open")) closeShareForm();
      else openShareForm();
    });

    document.addEventListener("pointerdown", function (event) {
      if (!shareFormCard.classList.contains("is-open")) return;
      if (shareFormCard.contains(event.target) || shareOpenBtn.contains(event.target)) return;
      closeShareForm();
    });

    shareForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      await fetchShareCooldown();
      if (updateShareCooldownUI()) {
        stopShareCooldownTick();
        shareCooldownTimer = setInterval(updateShareCooldownUI, 1000);
        return;
      }
      const name = String(shareName.value || "").trim();
      const playlistUrl = normalizePlaylistUrl(shareInput.value);
      const note = String(shareMessage.value || "").trim().slice(0, SHARE_NOTE_MAX);
      if (!name) {
        setShareStatus("Tell us your name.", "err");
        return;
      }
      if (!playlistUrl) {
        setShareStatus("Paste a Spotify playlist link.", "err");
        return;
      }
      if (!supabaseClient) {
        setShareStatus("Add your Supabase URL and anon key in config.js.", "err");
        return;
      }

      shareSubmit.disabled = true;
      setShareStatus("Saving…");
      const playlistName = await fetchPlaylistName(playlistUrl);
      const payload = {
        name: name,
        playlist_url: playlistUrl,
        playlist_name: playlistName || null,
        message: note || null,
        era: currentEra
      };
      let result = await supabaseClient.from("shared_playlists").insert(payload).select("id, name, playlist_url, playlist_name, message, created_at").single();
      if (result.error && /playlist_name|message/i.test(result.error.message || "")) {
        delete payload.playlist_name;
        delete payload.message;
        result = await supabaseClient.from("shared_playlists").insert({
          name: payload.name,
          playlist_url: payload.playlist_url,
          era: payload.era
        }).select("id, name, playlist_url, created_at").single();
        if (result.data) {
          result.data.playlist_name = playlistName;
          result.data.message = note;
        }
      }
      shareSubmit.disabled = false;

      if (result.error) {
        console.warn("[EraTV] share failed", result.error);
        const cool = String(result.error.message || "").match(/SHARE_COOLDOWN:(\d+)/);
        if (cool) {
          shareCooldownUntil = Date.now() + Number(cool[1]) * 1000;
          updateShareCooldownUI();
          stopShareCooldownTick();
          shareCooldownTimer = setInterval(updateShareCooldownUI, 1000);
          return;
        }
        setShareStatus(result.error.message || "Could not save. Check Supabase setup.", "err");
        return;
      }

      appendShareLine(result.data || payload);
      shareCooldownUntil = Date.now() + SHARE_COOLDOWN_MS;
      shareName.value = "";
      shareInput.value = "";
      shareMessage.value = "";
      closeShareForm();
    });

    async function loadSharedPlaylists() {
      if (!supabaseClient) return;
      let query = await supabaseClient
        .from("shared_playlists")
        .select("id, name, playlist_url, playlist_name, message, created_at")
        .order("created_at", { ascending: true })
        .limit(80);
      if (query.error && /playlist_name|message/i.test(query.error.message || "")) {
        query = await supabaseClient
          .from("shared_playlists")
          .select("id, name, playlist_url, created_at")
          .order("created_at", { ascending: true })
          .limit(80);
      }
      if (query.error) {
        console.warn("[EraTV] could not load shared playlists", query.error);
        return;
      }
      const rows = query.data || [];
      if (rows.length) {
        seenShareIds.clear();
        shareRows.length = 0;
        rows.forEach(appendShareLine);
      }
    }

    function startSharedPlaylistFeed() {
      loadSharedPlaylists();
      if (!supabaseClient) return;
      supabaseClient
        .channel("shared-playlists")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "shared_playlists" }, function (payload) {
          appendShareLine(payload.new);
        })
        .subscribe();
    }

    startSharedPlaylistFeed();

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
